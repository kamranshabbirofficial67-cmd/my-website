<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f5f5f7; 
            color: #1d1d1f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 18px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            text-align: center; 
            max-width: 400px; 
        }
        h1 { font-size: 28px; margin-bottom: 12px; }
        p { font-size: 16px; color: #86868b; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello World!</h1>
        <p>My website is officially live and hosted for free via GitHub Pages.</p>
    </div>
</body>
</html>
